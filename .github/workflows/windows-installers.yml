name: Windows installers

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} installer
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained native Windows app
        shell: pwsh
        run: >-
          dotnet publish AmNative/AmNative.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/publish/${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:WindowsAppSDKSelfContained=true

      - name: Verify app does not use or bundle WebView2
        shell: pwsh
        env:
          PUBLISH_DIR: ${{ github.workspace }}\artifacts\publish\${{ matrix.rid }}
        run: |
          $sourceFiles = Get-ChildItem . -Recurse -File -Include *.cs,*.xaml,*.csproj,*.props,*.targets,packages.lock.json |
            Where-Object { $_.FullName -notmatch '\\(\.git|artifacts|bin|obj)\\' }
          $webViewReferences = $sourceFiles |
            Select-String -Pattern 'Microsoft\.Web\.WebView2|Microsoft\.UI\.Xaml\.Controls\.WebView2|\bWebView2\b|CoreWebView2'
          if ($webViewReferences) {
            $webViewReferences | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'The app must not use WebView2.'
          }

          $dependencyManifests = Get-ChildItem $env:PUBLISH_DIR -Recurse -File -Include *.deps.json,packages.lock.json
          $webViewDependencies = $dependencyManifests |
            Select-String -Pattern '"Microsoft\.Web\.WebView2":'
          if ($webViewDependencies) {
            $webViewDependencies | ForEach-Object { Write-Error "$($_.Path): $($_.Line.Trim())" }
            throw 'The published app must not depend on the WebView2 SDK.'
          }

          $runtimeFiles = Get-ChildItem $env:PUBLISH_DIR -Recurse -File |
            Where-Object { $_.Name -match '(?i)^(msedgewebview2\.exe|msedge\.dll|msedge_elf\.dll|EmbeddedBrowserWebView\.dll)$' }
          if ($runtimeFiles) {
            $runtimeFiles | ForEach-Object { Write-Error "Unexpected WebView2 runtime file: $($_.FullName)" }
            throw 'The installer must not bundle the WebView2 runtime.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.platform }}
          PUBLISH_DIR: ${{ github.workspace }}\artifacts\publish\${{ matrix.rid }}
          APP_VERSION: 0.1.${{ github.run_number }}
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion="$env:APP_VERSION" /DBuildArch="$env:BUILD_ARCH" /DPublishDir="$env:PUBLISH_DIR" installer\am-native.iss'

      - uses: actions/upload-artifact@v6
        with:
          name: AM-Native-Setup-${{ matrix.platform }}
          path: artifacts/installers/*.exe
          if-no-files-found: error
          retention-days: 30
